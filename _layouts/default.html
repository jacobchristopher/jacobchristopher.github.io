<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
    <meta name="theme-color" content="#f7f8f6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <link rel="alternate icon" type="image/png" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}">
  </head>
  <body>
    <nav class="navbar" aria-label="Primary navigation">
      <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="nav-logo">
          <span class="logo-mark" aria-hidden="true">JC</span>
          <span class="logo-copy">
            <span class="logo-name">{{ site.title }}</span>
            <span class="logo-role">Ph.D. Candidate · University of Virginia</span>
          </span>
        </a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/publications' | relative_url }}" class="nav-link {% if page.url contains '/publications' %}active{% endif %}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/cv' | relative_url }}" class="nav-link {% if page.url contains '/cv' %}active{% endif %}"{% if page.url contains '/cv' %} aria-current="page"{% endif %}>CV</a>
        </div>
        <div class="nav-social">
          <a href="https://scholar.google.com/citations?user=z_PoUQAAAAJ&hl=en" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Google Scholar">
            <i class="fas fa-graduation-cap"></i>
          </a>
          <a href="https://www.linkedin.com/in/jacob-k-christopher-834a02239/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="mailto:csk4sr@virginia.edu" class="social-link" aria-label="Email Jacob Christopher">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </nav>

    <main class="main-content page-{{ page.title | downcase }}">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="footer-content">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
        <p class="footer-links">
          <a href="mailto:csk4sr@virginia.edu">Email</a>
          <a href="https://scholar.google.com/citations?user=z_PoUQAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a>
          <a href="https://www.linkedin.com/in/jacob-k-christopher-834a02239/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </p>
      </div>
    </footer>
  </body>
</html>
